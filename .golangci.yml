version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
    - errorlint
    - bodyclose
    - contextcheck
    - prealloc
    - gocyclo

linters-settings:
  gocyclo:
    min-complexity: 15
  gosec:
    excludes:
      - G115  # integer overflow (acceptable in test helpers)
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: package-comments

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    - path: example_test\.go
      linters:
        - gosec
        - errcheck
        - revive

run:
  timeout: 5m
  build-tags:
    - tools
