name: Feature Request
description: Propose a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping make the SDK better!"

  - type: input
    id: package
    attributes:
      label: Target Package
      description: Which package would this feature belong to? (or "new package")
      placeholder: "httpx"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should the feature work? Include API sketches if possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any workarounds or alternative designs?

  - type: checkboxes
    id: checklist
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a PR for this feature.
