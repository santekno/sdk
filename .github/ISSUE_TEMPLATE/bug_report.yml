name: Bug Report
description: Report a bug in the Santekno Go SDK
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug!"

  - type: input
    id: package
    attributes:
      label: Affected Package
      description: Which SDK package is affected? (e.g., httpx, timex, validx)
      placeholder: "httpx"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SDK Version
      description: Output of `go list -m github.com/santekno/sdk`
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: input
    id: go_version
    attributes:
      label: Go Version
      description: Output of `go version`
      placeholder: "go1.25 linux/amd64"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: |
        A minimal Go program or test that reproduces the issue.
      render: go
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
