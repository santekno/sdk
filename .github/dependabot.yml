version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gomod
    directory: "/middleware/gin"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "dependencies"
      - "go"
      - "middleware"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
